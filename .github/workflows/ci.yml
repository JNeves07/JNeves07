name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Testes Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.15"]

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Executar testes
        run: python -m unittest discover -s tests -v

      - name: Validar configuração do perfil
        run: python tools/profile_summary.py --validate

      - name: Gerar resumo local
        run: python tools/profile_summary.py --summary
